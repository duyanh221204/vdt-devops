grafana:
  adminPassword: admin
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 300m
  service:
    type: NodePort
    nodePort: 32100
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.observability.svc.cluster.local:3200

      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          filterBySpanID: false
          customQuery: false
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          tags:
            - key: service.name
              value: app

    - name: Loki
      type: loki
      uid: loki
      url: http://loki.observability.svc.cluster.local:3100

      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: "trace_id=([a-f0-9]{32})"
            datasourceUid: tempo
            url: "$${__value.raw}"
  sidecar:
    datasources:
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
        urlDisplayLabel: "View Trace"

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelectorNilUsesHelmValues: false
    retention: 2d
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    enableFeatures:
      - exemplar-storage
  service:
    type: NodePort
    nodePort: 32200

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 30m
      limits:
        memory: 128Mi
        cpu: 100m

kube-state-metrics:
  resources:
    requests:
      memory: 64Mi
      cpu: 30m
    limits:
      memory: 128Mi
      cpu: 100m
